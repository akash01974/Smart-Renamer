[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "smart-renamer"
version = "0.1.0"
description = "AI-powered bulk file renamer with TUI"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0.0",
    "pydantic>=2.0.0",
    "Pillow>=10.0.0",
    "httpx>=0.25.0",
]

[tool.setuptools.packages.find]
include = ["smart_renamer*"]
